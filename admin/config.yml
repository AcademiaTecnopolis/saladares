# ══════════════════════════════════════════════════════════════
#  Decap CMS — config.yml
#  RobotikSD · Colegio Saladares
#  Docs: https://decapcms.org/docs/
#
#  La web lee estos archivos JSON (se editan desde el panel):
#    js/data-2025-26.json  → fotos y vídeos del curso 2025-26
#    js/data-2026-27.json  → fotos y vídeos del curso 2026-27
#    js/data.json          → documentos PDF (+ lista de cursos)
#
#  Las rutas de este archivo son relativas a la RAÍZ del repositorio.
#  Si en tu repositorio js/ o content/ están en otra carpeta, ajústalas.
# ══════════════════════════════════════════════════════════════

backend:
  name: git-gateway          # Netlify Git Gateway
  branch: main

local_backend: false         # true para pruebas locales con npx decap-server

locale: es

# Carpeta por defecto (cada campo define la suya)
media_folder: "content/image"
public_folder: "/saladares/content/image"

collections:

  # ── CURSO 2026-27 (el actual) ─────────────────────────────
  - name: "curso-2026-27"
    label: "📅 Curso 2026-27"
    files:
      - name: "datos"
        label: "Fotos y vídeos 2026-27"
        file: "js/data-2026-27.json"
        fields:
          - label: "🖼️ Fotos"
            name: "images"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - label: "Imagen"
                name: "src"
                widget: "image"
                media_folder: "content/image/2026-27"
                public_folder: "/saladares/content/image/2026-27"
                hint: "Recomendado formato .webp o .jpg, máx. 800 px de ancho y 1 MB."
              - { label: "Comentario", name: "alt", widget: "string", required: false, hint: "Aparece al ampliar la foto. Ej: Alumnos programando con Scratch" }
          - label: "🎬 Vídeos de YouTube"
            name: "videos"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "URL o ID de YouTube", name: "youtubeId", widget: "string", hint: "Pega la URL completa (https://youtu.be/XXXX) o solo el ID de 11 caracteres." }
              - { label: "Descripción", name: "description", widget: "text", required: false }

  # ── CURSO 2025-26 ─────────────────────────────────────────
  - name: "curso-2025-26"
    label: "📅 Curso 2025-26"
    files:
      - name: "datos"
        label: "Fotos y vídeos 2025-26"
        file: "js/data-2025-26.json"
        fields:
          - label: "🖼️ Fotos"
            name: "images"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - label: "Imagen"
                name: "src"
                widget: "image"
                media_folder: "content/image/2025-26"
                public_folder: "/saladares/content/image/2025-26"
                hint: "Recomendado formato .webp o .jpg, máx. 800 px de ancho y 1 MB."
              - { label: "Comentario", name: "alt", widget: "string", required: false, hint: "Aparece al ampliar la foto." }
          - label: "🎬 Vídeos de YouTube"
            name: "videos"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "URL o ID de YouTube", name: "youtubeId", widget: "string" }
              - { label: "Descripción", name: "description", widget: "text", required: false }

  # ── DOCUMENTOS PDF (comunes a todos los cursos) ───────────
  - name: "documentos"
    label: "📄 Documentos PDF"
    files:
      - name: "pdfs"
        label: "Documentos PDF"
        file: "js/data.json"
        fields:
          - label: "Documentos"
            name: "pdfs"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Nombre del documento", name: "name", widget: "string" }
              - label: "Archivo PDF"
                name: "url"
                widget: "file"
                media_folder: "content/pdfs"
                public_folder: "/saladares/content/pdfs"
                hint: "Máx. recomendado: 10 MB."
              - { label: "Descripción", name: "description", widget: "text", required: false }
              - { label: "Tamaño (para mostrar)", name: "size", widget: "string", required: false, hint: "Ej: 2.4 MB" }
          # Campos que la web necesita en este mismo archivo. No se editan aquí,
          # pero se declaran para que Decap no los borre al guardar.
          - { label: "Cursos", name: "cursos", widget: "hidden" }
          - { label: "Proyectos", name: "projects", widget: "hidden" }

# ══════════════════════════════════════════════════════════════
#  CÓMO AÑADIR UN CURSO NUEVO (ej. 2027-28), una vez al año:
#   1. Crea js/data-2027-28.json con:  {"images": [], "videos": []}
#   2. En js/data.json, añade a "cursos":
#        {"id": "2027-28", "file": "/saladares/js/data-2027-28.json"}
#   3. Copia el bloque "curso-2026-27" de este archivo, cambia
#      2026-27 por 2027-28 en name, label, file y carpetas.
#   4. Crea la carpeta content/image/2027-28/
#  La web mostrará el curso nuevo automáticamente.
# ══════════════════════════════════════════════════════════════
